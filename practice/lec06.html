<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lec06 · 다양한 입력 폼</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="practice.css"><script src="forms.js" defer></script></head><body><a class="skip-link" href="#main">본문으로 바로가기</a><div class="page"><header><div class="topline"><a href="../index.html#weekly">← 이력서로 돌아가기</a><span>LEC 06 / 06</span></div><h1>다양한 입력 폼</h1><p class="eyebrow">웹프로그래밍 · 강의별 실습</p><nav class="lesson-nav" aria-label="강의별 실습"><a href="lec01.html">1강</a><a href="lec02.html">2강</a><a href="lec03.html">3강</a><a href="lec04.html">4강</a><a href="lec05.html">5강</a><a href="lec06.html">6강</a></nav></header><main id="main"><section><h2>도서 구입 요청 폼</h2><p>학습용 폼입니다. 입력값은 서버로 전송하거나 저장하지 않습니다.</p><form id="book-form"><fieldset><legend>도서 선택</legend><label for="book">도서명 (필수)</label><input id="book" name="book" type="text" list="books" required maxlength="100"><datalist id="books"><option value="멀티미디어배움터"></option><option value="인터넷배움터"></option><option value="컴퓨터와 IT 기술의 이해"></option></datalist><label for="category">분류</label><select id="category" name="category"><option>웹프로그래밍</option><option>보안</option><option>컴퓨터 기초</option></select><label for="preference">선호도 (1~5)</label><input id="preference" name="preference" type="range" min="1" max="5" value="3"><label for="price">가격 (원)</label><input id="price" name="price" type="number" min="0" max="1000000" step="100" value="10000" required><label for="quantity">권수 (1~20)</label><input id="quantity" name="quantity" type="number" min="1" max="20" value="1" required><label for="date">희망일</label><input id="date" name="date" type="date"><label for="memo">선택 이유</label><textarea id="memo" name="memo" rows="3" maxlength="300"></textarea></fieldset><fieldset><legend>도서 형태</legend><label class="inline"><input type="radio" name="format" value="종이책" checked>종이책</label><label class="inline"><input type="radio" name="format" value="전자책">전자책</label><label class="inline"><input type="checkbox" name="notice" required>실제 주문이 아닌 연습임을 확인했습니다.</label></fieldset><div class="actions"><button type="submit">입력 결과 확인</button><button type="reset">초기화</button></div><p id="form-result" role="status" aria-live="polite">아직 확인한 입력이 없습니다.</p></form></section><section><h2>직접 해볼 일</h2><p>소스에서 내용이나 속성을 하나 바꾸고 결과를 확인하세요. 변경한 내용과 이유를 본인의 말로 기록한 뒤 학습 완료 여부를 판단하세요.</p></section></main><footer><span>강의 번호 기준 실습 · 실제 주차 확인 필요</span><a href="../index.html#weekly">이력서로</a></footer></div></body></html>
